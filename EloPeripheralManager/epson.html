</style>
</head>

<body>

<div class="container">

<input id="printerInput" readonly>

Initialize

Query Printers

Disconnect
</button>

Status
</button>

Print Barcode
</button>

<button onclick="printDemoReceipt()">
Print Demo Receipt
</button>

Print Logo
</button>

Check Paper
</button>

<hr>

<h3>Log</h3>

<textarea id="logWindow" readonly></textarea>

</div>

<script>

function log(message){

    const area =
        document.getElementById("logWindow");

    const timestamp =
        new Date().toLocaleTimeString();

    area.value +=
        "[" + timestamp + "] " +
        message + "\n";

    area.scrollTop =
        area.scrollHeight;
}

window.onerror = function(msg){

    log("JS ERROR: " + msg);

    return false;
};

//////////////////////////////////////////////////
// INITIALIZE
//////////////////////////////////////////////////

function initializePrinter(){

    try{

        log("Initializing Epson Manager");

        EloEpsonPrinterManager.initialize(
            "onEpsonPrinterManagerReady"
        );

    }catch(ex){

        log("Initialize Error: " + ex);
    }
}

function onEpsonPrinterManagerReady(){

    log("Epson Manager Ready");

    queryPrinterList();

    updateStatus();
}

//////////////////////////////////////////////////
// QUERY
//////////////////////////////////////////////////

function queryPrinterList(){

    try{

        EloEpsonPrinterManager
            .updatePrinterList();

        const printers =
            EloEpsonPrinterManager
                .queryPrinterList();

        document.getElementById(
            "printerInput"
        ).value = printers;

        log("Printers: " + printers);

    }catch(ex){

        log("Query Error: " + ex);
    }
}

//////////////////////////////////////////////////
// CONNECT FIRST PRINTER
//////////////////////////////////////////////////

function connectPrinter(){

    try{

        let printers =
            EloEpsonPrinterManager
                .queryPrinterList();

        if(!printers){

            log("No printers found");
            return;
        }

        let firstPrinter =
            printers;

        if(
            firstPrinter.startsWith("[") &&
            firstPrinter.endsWith("]")
        ){

            firstPrinter =
                firstPrinter
                    .slice(1,-1)
                    .split(",")[0]
                    .trim();
        }

        log(
            "Connecting to: " +
            firstPrinter
        );

        const result =
            EloEpsonPrinterManager
                .connectPrinter(
                    firstPrinter
                );

        log(
            "Connect Result: " +
            result
        );

        updateStatus();

    }catch(ex){

        log(
            "Connect Error: " +
            ex
        );
    }
}

//////////////////////////////////////////////////
// DISCONNECT
//////////////////////////////////////////////////

function disconnectPrinter(){

    try{

        const result =
            EloEpsonPrinterManager
                .disconnectPrinter();

        log(
            "Disconnect Result: " +
            result
        );

        updateStatus();

    }catch(ex){

        log(
            "Disconnect Error: " +
            ex
        );
    }
}

//////////////////////////////////////////////////
// STATUS
//////////////////////////////////////////////////

function updateStatus(){

    try{

        const connected =
            EloEpsonPrinterManager
                .isPrinterConnected();

        document.getElementById(
            "status"
        ).innerHTML =
            connected
            ? "Printer Connected"
            : "Printer Disconnected";

        log(
            "Connected = " +
            connected
        );

    }catch(ex){

        log(
            "Status Error: " +
            ex
        );
    }
}

//////////////////////////////////////////////////
// BARCODE
//////////////////////////////////////////////////

function printBarcode(){

    try{

        const barcode =
            document.getElementById(
                "barcodeInput"
            ).value;

        const result =
            EloEpsonPrinterManager
                .printBarcode(
                    barcode
                );

        log(
            "Barcode Result: " +
            result
        );

    }catch(ex){

        log(
            "Barcode Error: " +
            ex
        );
    }
}
