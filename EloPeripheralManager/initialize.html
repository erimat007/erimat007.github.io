<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Elo Peripheral Manager Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }

        #result {
            width: 100%;
            height: 150px;
            margin-top: 15px;
            padding: 10px;
            font-family: Consolas, monospace;
        }
    </style>
</head>
<body>

    <h2>Elo Peripheral Manager Test</h2>

    <button id="initializeBtn">Initialize</button>

    <br><br>

    <textarea id="result" readonly>
Ready...
    </textarea>

    <script>

        function log(message) {
            document.getElementById("result").value = message;
            console.log(message);
        }

        function onPeripheralManagerReady(serviceBound) {

            if (serviceBound === "true") {
                log("SUCCESS: EloPeripheralManager initialized.\nService Bound = " + serviceBound);
            } else {
                log("FAILED: EloPeripheralManager not available.\nService Bound = " + serviceBound);
            }
        }

        document.getElementById("initializeBtn").addEventListener("click", function () {

            try {

                if (typeof EloPeripheralManager === "undefined") {
                    log("ERROR: EloPeripheralManager object not found.\n\nAre you running on an Elo device with WebView Hardware Access enabled?");
                    return;
                }

                log("Initializing Elo Peripheral Manager...");

                EloPeripheralManager.initialize("onPeripheralManagerReady");

            } catch (error) {

                log("Exception:\n" + error);

            }
        });

    </script>

</body>
</html>
