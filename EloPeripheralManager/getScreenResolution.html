<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Elo Screen Resolution Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            margin-bottom: 15px;
        }

        #log {
            border: 1px solid #ccc;
            background: #f5f5f5;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
        }
    </style>
</head>
<body>

    <h2>Elo Screen Resolution Test</h2>

    <button id="btnResolution" disabled>
        Get Screen Resolution
    </button>

    <button onclick="clearLog()">
        Clear Log
    </button>

    <h3>Status</h3>
    <div id="log"></div>

    <script>

        function log(message) {
            const logWindow = document.getElementById("log");
            const timestamp = new Date().toLocaleTimeString();

            logWindow.innerHTML += "[" + timestamp + "] " + message + "<br>";
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        function clearLog() {
            document.getElementById("log").innerHTML = "";
        }

        window.onload = function () {

            log("Page loaded");
            log("Initializing EloPeripheralManager...");

            try {
                EloPeripheralManager.initialize("onPeripheralManagerReady");
            } catch (e) {
                log("Initialization failed: " + e.message);
            }
        };

        function onPeripheralManagerReady(serviceBound) {

            log("onPeripheralManagerReady called");
            log("serviceBound = " + serviceBound);

            if (serviceBound === "true") {
                document.getElementById("btnResolution").disabled = false;
                log("Peripheral Manager connected");
            } else {
                log("Peripheral Manager not connected");
            }
        }

        document.getElementById("btnResolution").addEventListener("click", function () {

            log("Get Screen Resolution clicked");

            try {
                var resolution = EloPeripheralManager.getScreenResolution();

                log("Resolution: " + resolution);
            }
            catch (e) {
                log("Error: " + e.message);
            }
        });

    </script>

</body>
</html>
