<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Elo Screen Resolution Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            margin-bottom: 10px;
        }

        input {
            width: 300px;
            padding: 8px;
        }

        .status {
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status" class="status">Initializing...</div>

    <button id="btnGetResolution" disabled>
        Get Screen Resolution
    </button>

    <br><br>

    <input type="text" id="result" readonly>

    <script>

        window.onload = function () {
            try {
                EloPeripheralManager.initialize("onPeripheralManagerReady");
            } catch (e) {
                document.getElementById("status").innerHTML =
                    "EloPeripheralManager not available: " + e.message;
            }
        };

        function onPeripheralManagerReady(serviceBound) {

            document.getElementById("status").innerHTML =
                "Peripheral Manager Ready: " + serviceBound;

            if (serviceBound === "true") {
                document.getElementById("btnGetResolution").disabled = false;
            }
        }

        document.getElementById("btnGetResolution")
            .addEventListener("click", function () {

                try {
                    var resolution =
                        EloPeripheralManager.getScreenResolution();

                    document.getElementById("result").value = resolution;
                } catch (e) {
                    document.getElementById("result").value =
                        "Error: " + e.message;
                }
            });

    </script>

</body>
</html>
